# Production / self-hosted stack for a single box. Run from the repo root:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Before first run, copy .env.production.example to .env.production and fill in
# real secrets (see that file for what must change from the dev defaults).

services:
  postgres:
    image: postgres:16-alpine
    container_name: ums-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ums_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ums_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ums_user} -d ${POSTGRES_DB:-ums_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ums-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: ums-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    # NOTE: Mailpit is a dev-only mail catcher — it never delivers real email.
    # Point SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS (in .env.production) at a
    # real relay before relying on this stack for production notifications.

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ums-api:${IMAGE_TAG:-latest}
    container_name: ums-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ums_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ums_db}?schema=public
    entrypoint: []
    command: ["packages/db/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ums-api:${IMAGE_TAG:-latest}
    container_name: ums-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ums_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ums_db}?schema=public
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "5500:5500"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5500/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: ums-worker:${IMAGE_TAG:-latest}
    container_name: ums-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ums_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ums_db}?schema=public
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5500/api/v1}
    image: ums-web:${IMAGE_TAG:-latest}
    container_name: ums-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
